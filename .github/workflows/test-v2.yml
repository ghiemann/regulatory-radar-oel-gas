name: Test Regulatory Radar v2

on:
  push:
    branches:
      - radar-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci  
        
      - name: Check shared utility syntax
        run: node --check scripts/lib/document-utils.mjs
        
      - name: Test BMWE import filters
        run: npm run test:bmwe-filters
        
      - name: Fetch BMWE test data
        run: npm run fetch:bmwe
        env:
          BMWE_START_DATE: "2026-10-01"
          BMWE_MAX_ITEMS: 20

      - name: Validate generated data
        run: npm run validate:data


      - name: Build application
        run: npm run build
